name: si-appik

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sik}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: Asia/Makassar
      PGTZ: Asia/Makassar
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Hanya diakses dari host (127.0.0.1) agar tidak terbuka ke jaringan.
      # Host 5433 dipakai supaya tidak bentrok dengan PostgreSQL lokal di 5432.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 24
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: "Aduan Infrastruktur Kolaka Utara"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi di file .env root}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_TIMEZONE: Asia/Makassar
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: id
      APP_FAKER_LOCALE: id_ID

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-sik}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: public

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: "no-reply@kabupaten.go.id"
      MAIL_FROM_NAME: "Aduan Infrastruktur Kolaka Utara"

      # Python di image Debian bernama python3, bukan python.
      AI_PYTHON_BINARY: /usr/bin/python3
      AI_CV_PROVIDER: opencv
      DUPLICATE_RADIUS_M: 100
      UPLOAD_MAX_MB: 10
    volumes:
      # Foto aduan & bukti pengerjaan bertahan walau container dibuat ulang.
      - app-storage:/var/www/html/storage/app
      # Opsional: impor data demo dari dump saat volume database masih kosong.
      - ./si-appik.sql:/var/www/html/database/si-appik.sql:ro
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # Konektor Cloudflare Tunnel. Hanya aktif bila dijalankan dengan --profile tunnel
  # dan TUNNEL_TOKEN sudah diisi di .env root.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["tunnel"]

volumes:
  db-data:
  app-storage:
