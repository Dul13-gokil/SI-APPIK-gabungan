name: citizen_complaint_app
description: "Aplikasi Pengaduan Infrastruktur Kabupaten untuk Warga berbasis Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Network & API
  dio: ^5.7.0
  
  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Location & GIS
  geolocator: ^13.0.1
  latlong2: ^0.9.1
  flutter_map: ^7.0.2

  # Media & Camera
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI, Icons, Typography
  google_fonts: ^6.2.1
  intl: ^0.19.0
  lucide_icons_flutter: ^3.1.17
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

